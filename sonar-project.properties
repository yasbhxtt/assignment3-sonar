sonar.projectKey=yasbhxtt_assignment3-sonar
sonar.organization=yasbhxtt

# application code and tests
sonar.exclusions=**/*.txt,**/*.vcxproj*,build/**,tests/**
sonar.sourceEncoding=UTF-8

# C++ analysis: how each file is compiled (written by CMake during the CI build)
sonar.cfamily.compile-commands=build/compile_commands.json

# coverage produced by gcovr in the workflow (SonarQube generic coverage format)
sonar.coverageReportPaths=coverage.xml
